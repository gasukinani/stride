name: Build Stride Mobile Studio (Android APK)

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  PROJECT_PATH: 'sources/editor-mobile/StrideStudio.Mobile/StrideStudio.Mobile.csproj'
  DOTNET_CLI_DO_NOT_USE_MSBUILD_SERVER: '1'
  MSBUILDDISABLENODEREUSE: '1'

jobs:
  build-android:
    runs-on: windows-latest

    steps:
      # 1. I-checkout ang repository kasama ang Submodules at Git LFS
      - name: Checkout Repository with Submodules and LFS
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true
          fetch-depth: 0

      # 2. Tiyaking kumpleto at updated ang lahat ng Git LFS binary dependencies
      - name: Pull Git LFS Objects
        shell: pwsh
        run: |
          git lfs install
          git lfs pull

      # 3. Linisin ang lumang Stride Temp Cache para maiwasan ang stale files
      - name: Clean Stride Temp Cache
        shell: pwsh
        run: |
          if (Test-Path "$env:LOCALAPPDATA\Temp\stride") {
              Remove-Item -Recurse -Force "$env:LOCALAPPDATA\Temp\stride" -ErrorAction SilentlyContinue
          }

      # 4. Setup Java JDK 17
      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 5. Setup .NET 10 SDK (Pre-release enabled)
      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          include-prerelease: true

      # 6. I-install ang opisyal na .NET Android Workload
      - name: Install .NET Android Workload
        shell: pwsh
        run: |
          dotnet workload install android --verbosity normal

      # 7. Restore Dependencies para sa Android Target
      - name: Restore Project Dependencies
        shell: pwsh
        run: |
          dotnet restore $env:PROJECT_PATH `
            -p:StridePlatform=Android `
            -p:TreatWarningsAsErrors=false

      # 8. Build at Publish APK Package
      # Naka-lock sa net10.0-android, walang CA analyzer locks, at walang multi-target collisions
      - name: Build and Publish Android APK
        shell: pwsh
        run: |
          dotnet publish $env:PROJECT_PATH `
            -c Release `
            -f net10.0-android `
            -p:StridePlatform=Android `
            -p:AndroidPackageFormat=apk `
            -p:AndroidCreatePackagePerAbi=false `
            -p:TreatWarningsAsErrors=false `
            -p:RunAnalyzersDuringBuild=false `
            -p:EnableNETAnalyzers=false `
            -p:UseSharedCompilation=false `
            -p:BuildInParallel=false `
            -maxcpucount:1 `
            -nr:false `
            -v normal

      # 9. I-upload ang Signed APK Artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StrideStudio-Mobile-APK
          path: |
            sources/editor-mobile/StrideStudio.Mobile/bin/Release/net10.0-android/*-Signed.apk
            sources/editor-mobile/StrideStudio.Mobile/bin/Release/net10.0-android/*.apk
          retention-days: 7
          if-no-files-found: error
