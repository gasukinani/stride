name: Build Stride Mobile Studio (Android APK)

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  PROJECT_PATH: 'sources/editor-mobile/StrideStudio.Mobile/StrideStudio.Mobile.csproj'
  DOTNET_CLI_DO_NOT_USE_MSBUILD_SERVER: '1'
  MSBUILDDISABLENODEREUSE: '1'

jobs:
  build-android:
    runs-on: windows-latest

    steps:
      # 1. Checkout kasama ang Submodules at Git LFS
      - name: Checkout Repository with Submodules and LFS
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true
          fetch-depth: 0

      # 2. Tiyaking na-download ang lahat ng LFS binaries
      - name: Pull Git LFS Objects
        run: |
          git lfs install
          git lfs pull

      # 3. Linisin ang lumang Stride Temp Cache
      - name: Clean Stride Temp Cache
        run: |
          if (Test-Path "$env:LOCALAPPDATA\Temp\stride") {
              Remove-Item -Recurse -Force "$env:LOCALAPPDATA\Temp\stride"
          }

      # 4. Setup Java JDK 17
      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 5. Setup .NET 10 SDK
      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          include-prerelease: true

      # 6. Install .NET Android Workload
      - name: Install .NET Android Workload
        run: |
          dotnet workload install android --verbosity normal

      # 7. Restore Dependencies
      - name: Restore Project Dependencies
        run: |
          dotnet restore ${{ env.PROJECT_PATH }} `
            -p:StridePlatform=Android `
            -p:StrideGraphicsApi=OpenGLES

      # 8. Pre-build Host Dependencies (Iwas CS2012 File Lock sa AssemblyProcessor)
      - name: Pre-build Host Core Assemblies
        run: |
          dotnet build sources/core/Stride.Core.Serialization/Stride.Core.Serialization.csproj `
            -c Release `
            -f net10.0 `
            -p:UseSharedCompilation=false `
            -p:BuildInParallel=false

      # 9. Build & Publish Android APK
      - name: Build & Publish APK
        run: |
          dotnet publish ${{ env.PROJECT_PATH }} `
            -c Release `
            -f net10.0-android `
            -p:StridePlatform=Android `
            -p:StrideGraphicsApi=OpenGLES `
            -p:AndroidPackageFormat=apk `
            -p:AndroidCreatePackagePerAbi=false `
            -p:UseSharedCompilation=false `
            -p:BuildInParallel=false `
            -maxcpucount:1 `
            -nr:false `
            -v normal

      # 10. Upload APK Artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StrideStudio-Mobile-APK
          path: |
            sources/editor-mobile/StrideStudio.Mobile/bin/Release/net10.0-android/*-Signed.apk
            sources/editor-mobile/StrideStudio.Mobile/bin/Release/net10.0-android/*.apk
          retention-days: 7
          if-no-files-found: error          dotnet publish ${{ env.PROJECT_PATH }} `
            -c Release `
            -f net10.0-android `
            -p:StridePlatform=Android `
            -p:StrideGraphicsApi=OpenGLES `
            -p:AndroidPackageFormat=apk `
            -p:AndroidCreatePackagePerAbi=false `
            -p:UseSharedCompilation=false `
            -nr:false `
            -v normal

      # 9. Hanapin at i-upload ang APK Artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StrideStudio-Mobile-APK
          path: |
            sources/editor-mobile/StrideStudio.Mobile/bin/Release/net10.0-android/*-Signed.apk
            sources/editor-mobile/StrideStudio.Mobile/bin/Release/net10.0-android/*.apk
          retention-days: 7
          if-no-files-found: error
