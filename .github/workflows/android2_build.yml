name: Build Stride Mobile Studio (Android APK)

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Button para sa manual trigger sa GitHub Actions

env:
  DOTNET_VERSION: '8.0.x'
  PROJECT_PATH: 'sources/editor-mobile/StrideStudio.Mobile/StrideStudio.Mobile.csproj'

jobs:
  build-android:
    runs-on: windows-latest

    steps:
      # 1. I-checkout ang repo kasama ang SUBMODULES (kritikal para sa Stride engine source build)
      - name: Checkout Repository with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # 2. Setup Java JDK 17 (kailangan ng Android build tools at Dex compiler)
      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Setup .NET SDK
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # 4. I-install ang .NET Android Workload
      - name: Install .NET Android Workload
        run: |
          dotnet workload install android --verbosity normal

      # 5. Restore Dependencies (Isasama nito ang Stride.Engine, Stride.Physics, UI, atbp. via ProjectReference)
      - name: Restore Project & Stride Engine References
        run: |
          dotnet restore ${{ env.PROJECT_PATH }} `
            -p:StridePlatform=Android `
            -p:CheckEolWorkloads=false `
            -p:CheckEolTargetFramework=false `
            -p:ManagePackageVersionsCentrally=false

      # 6. I-build at i-publish ang Android APK
      # Babala: Huwag lagyan ng '--no-restore' para masigurong nai-build ng maayos ang mga project dependencies
      - name: Build & Publish APK (Release Mode)
        run: |
          dotnet publish ${{ env.PROJECT_PATH }} `
            -c Release `
            -f net8.0-android `
            -p:StridePlatform=Android `
            -p:CheckEolWorkloads=false `
            -p:CheckEolTargetFramework=false `
            -p:ManagePackageVersionsCentrally=false `
            -p:AndroidPackageFormat=apk `
            -p:AndroidCreatePackagePerAbi=false `
            -o ./output/apk

      # 7. I-upload ang APK bilang downloadable artifact sa GitHub Actions
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StrideStudio-Mobile-APK
          path: |
            ./output/apk/*.apk
          retention-days: 7
          if-no-files-found: error
