name: Test Android Build

on:
  workflow_dispatch: # Para ma-click mo ang "Run" button anumang oras
  push:
    branches: [ master, main ]

jobs:
  build-android:
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Setup Java JDK (Para sa Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install .NET Android Workload
        run: |
          dotnet workload install android

      - name: Restore Dependencies
        run: |
          dotnet restore Stride.sln /p:StridePlatform=Android

      # Susubukang i-build ang buong Stride solution para sa Android platform
      - name: Attempt Build for Android Platform
        run: |
          dotnet build Stride.sln -c Release /p:StridePlatform=Android /p:AndroidPackageFormat=apk

      # Kung may mabubuong anumang .apk saanman sa repository, hahanapin at ia-upload ito
      - name: Find and Upload APK (Kung may nagawa)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Stride-Android-Result
          path: |
            **/*.apk
            **/*.aab
          if-no-files-found: warn
