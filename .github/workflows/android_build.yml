name: Test Android Build

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build-android:
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install .NET Android Workload
        run: |
          dotnet workload install android

      # Dito nakalagay ang solusyon: build/Stride.Android.sln
      - name: Restore Dependencies
        run: |
          dotnet restore build/Stride.Android.slnf /p:StridePlatform=Android

      # Build Stride Android solution
      - name: Attempt Build for Android Platform
        run: |
          dotnet build build/Stride.Android.slnf -c Release /p:StridePlatform=Android

      # Maghahanap kung may nalikhang .apk o Android binaries
      - name: Find and Upload Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Stride-Android-Build-Output
          path: |
            **/*.apk
            **/*.aab
            build/**/bin/Release/**/*.dll
          if-no-files-found: warn
