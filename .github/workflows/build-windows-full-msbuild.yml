name: Build Android (Full, VS MSBuild)

on:
  schedule:
    - cron: '52 4 * * *'
  workflow_dispatch:
    inputs:
      build-type:
        description: Build Configuration
        default: Release
        type: choice
        options:
          - Debug
          - Release
  pull_request:
    paths:
      - 'sources/sdk/**'
      - 'sources/targets/**'
      - 'sources/native/**'
      - '.github/workflows/build-android-full-msbuild.yml'

concurrency:
  group: build-android-full-msbuild-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  Android-MSBuild:
    name: Android Full (VS MSBuild, ${{ github.event.inputs.build-type || 'Release' }})
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          submodules: true

      # Kailangan ng Android build ang Java JDK
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Android SDK at platform tools
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # I-install ang Android workload para sa .NET / MSBuild
      - name: Install .NET Android Workload
        run: |
          dotnet workload install android

      # VsDevCmd environment para sa native toolchain
      - uses: ilammy/msvc-dev-cmd@v1

      - name: Restore
        run: |
          msbuild build\Stride.slnx `
            /t:Restore `
            /m /nr:false /v:m /p:WarningLevel=0 `
            /p:Configuration=${{ github.event.inputs.build-type || 'Release' }} `
            /p:Platform="Any CPU" `
            /p:StridePlatforms=Android `
            /p:StrideGraphicsApiDependentBuildAll=true `
            /p:StrideSkipUnitTests=true `
            /p:StrideSkipAutoPack=true

      - name: Build
        run: |
          msbuild build\Stride.slnx `
            /m /nr:false /v:m /p:WarningLevel=0 `
            /p:Configuration=${{ github.event.inputs.build-type || 'Release' }} `
            /p:Platform="Any CPU" `
            /p:StridePlatforms=Android `
            /p:StrideGraphicsApiDependentBuildAll=true `
            /p:StrideSkipUnitTests=true `
            /p:StrideSkipAutoPack=true `
            /p:AndroidPackageFormat=apk

      # Kukunin ang anumang .apk o nabuong Android packages
      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Stride-Android-Output
          path: |
            **/*.apk
            **/*.aab
            bin/**/*.dll
          if-no-files-found: warn            /p:StrideSkipUnitTests=true `
            /p:StrideSkipAutoPack=true
